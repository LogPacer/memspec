version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: cron
    cronjob: 0 6 * * 1,3,5
    timezone: Europe/Copenhagen
  open-pull-requests-limit: 5
  cooldown:
    default-days: 3
    semver-major-days: 14
    semver-minor-days: 3
    semver-patch-days: 3
  groups:
    terminal-ui:
      patterns:
      - ratatui
      - crossterm
      update-types:
      - minor
      - patch
    patch-updates:
      patterns:
      - '*'
      update-types:
      - patch
